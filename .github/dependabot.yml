version: 2

updates:
  # Grouped so a quiet week produces one PR, not six. Every PR still has to pass
  # `ci` and `Workers Builds: critical-path`, both required on main — lint,
  # astro check and a real Cloudflare build are the review this repo has instead
  # of a test suite.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # Pinned action tags are mutable; this at least surfaces when they move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
