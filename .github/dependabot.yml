version: 2

updates:
  # One group per kind of update, so a week produces one npm PR, not two or
  # three. Every npm PR touches package-lock.json, and main requires branches
  # to be up to date, so each extra PR meant another branch update and CI run
  # after the first one merged. Security updates arrive off-schedule, so they
  # get their own group instead of one PR per advisory.
  # Major version updates stay out of the group and arrive one PR each. They
  # are never auto-merged (.github/workflows/dependabot-auto-merge.yml), so in
  # the group a single major would hold back every minor and patch bump for
  # the week; on their own, only weeks with a major cost an extra PR.
  # Every PR still has to pass `ci` and `Workers Builds: critical-path`, both
  # required on main — lint, astro check, `npm test`, a real Cloudflare build
  # and `npm run check:csp` on the built pages are the review every dependency
  # bump gets. The last one fails a bump (Astro above all) that moves or drops
  # the CSP meta.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # TypeScript 7 cannot install: @astrojs/check declares
      # `typescript@"^5.0.0 || ^6.0.0"`, so `npm ci` fails at resolution before
      # any code runs (PR #7). Without this, Dependabot keeps a PR open that can
      # never go green, and a permanently red PR teaches everyone to ignore red.
      # Remove this once @astrojs/check widens its peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Pinned action tags are mutable; this at least surfaces when they move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
