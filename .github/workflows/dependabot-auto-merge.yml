# Turns on auto-merge for Dependabot PRs that are not a major bump. It never
# merges by itself: the required checks on main (`ci` and `Workers Builds:
# critical-path`, including `npm run check:csp`) still decide, and a major
# bump anywhere in a grouped PR leaves the whole PR for a manual merge.
#
# A merge made with GITHUB_TOKEN starts no workflows, so the `push: main` run
# of ci.yml does not follow an auto-merge. The PR already ran the same gates,
# and Workers Builds still deploys: it is a Cloudflare app, not a workflow.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'RemekGdansk/critical-path'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Squash, not --merge: main allows no merge commits and requires linear history.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
