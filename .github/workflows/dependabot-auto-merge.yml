# Turns on auto-merge for Dependabot PRs whose highest bump is minor or patch.
# It never merges by itself: the required checks on main (`ci` and `Workers
# Builds: critical-path`, including `npm run check:csp`) still decide.
# Anything else (a major bump, or a PR whose bump type fetch-metadata cannot
# read) is left for a manual merge, and auto-merge is turned off again if an
# earlier push had turned it on: Dependabot refreshes an open group PR in
# place, so a PR armed while it held only minor bumps can gain a major one.
#
# A merge made with GITHUB_TOKEN starts no workflows, so the `push: main` run
# of ci.yml does not follow an auto-merge. The PR already ran the same gates,
# and Workers Builds still deploys: it is a Cloudflare app, not a workflow.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'RemekGdansk/critical-path'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # An allowlist, not `!= semver-major`: an empty update-type must not arm
      # auto-merge. Squash, not --merge: main allows no merge commits and
      # requires linear history.
      - run: |
          case "$UPDATE_TYPE" in
            version-update:semver-minor | version-update:semver-patch)
              gh pr merge --auto --squash "$PR_URL"
              ;;
            *)
              if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
                gh pr merge --disable-auto "$PR_URL"
              fi
              ;;
          esac
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
