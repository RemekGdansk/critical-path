# Quality gate only — this workflow never deploys. Deployment is owned by
# Cloudflare Workers Builds, which runs the same gates in its build command and
# does not wait for this run. See context/deployment/deploy-plan.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm run build
