# Quality gate only — this workflow never deploys. Deployment is owned by
# Cloudflare Workers Builds, which runs the same gates in its build command and
# does not wait for this run. See context/deployment/deploy-plan.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not a tag: a tag is mutable and whoever controls it
      # controls what runs here. Dependabot (github-actions ecosystem) proposes
      # bumps as reviewable PRs, so the pin does not mean going stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - run: npm run check:csp # reads the built HTML in dist/, not astro.config.mjs
      # E2E on Chromium against build + preview, the only mode with the CSP in
      # effect: export, import and the CSP in the running app. CI only, never in
      # the Workers Builds command (see context/foundation/test-stack.md).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
